openapi: 3.1.0

info:
  title: Messenger API
  version: 0.1.0
  description: |
    HTTP API мессенджера.

    Поддерживаются только личные чаты между двумя
    пользователями.

    HTTP API используется для регистрации, входа, обновления JWT,
    поиска пользователей, работы с чатами и загрузки истории сообщений.
    Команды и события сообщений описаны в backend/docs/websocket.md.

    Целевые показатели (не подтверждены нагрузочным тестом): p95 чтений
    до 300 мс, создания чата и обновления JWT до 500 мс, регистрации и
    входа до 1000 мс при базовом пиковом профиле из README.

    ErrorResponse описывает ошибки AppException из приложения.
    Ошибки Spring Security и стандартной обработки запросов могут
    возвращаться без этого JSON-тела. Профиль нагрузки и целевые
    показатели производительности приведены в README.

servers:
  - url: http://localhost:8080
    description: Локальный backend

tags:
  - name: Authentication
    description: Регистрация, вход и продление доступа
  - name: Users
    description: Поиск пользователей
  - name: Chats
    description: Личные чаты и история сообщений

security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Зарегистрировать пользователя
      operationId: registerUser
      security: []
      description: |
        Создаёт аккаунт и профиль в одной транзакции и возвращает JWT.
        login и username должны быть уникальны. Пароль хранится как BCrypt-хеш.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: login или username уже занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                loginTaken:
                  value:
                    error: LOGIN_ALREADY_EXISTS
                    message: A user with this login already exists
                    status: 409
                usernameTaken:
                  value:
                    error: USERNAME_ALREADY_EXISTS
                    message: A user with this username already exists
                    status: 409
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Войти по логину и паролю
      operationId: loginUser
      security: []
      description: |
        Возвращает JWT и профиль пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorisationRequest'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный логин или пароль (ошибка приложения)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_CREDENTIALS
                message: Invalid credentials
                status: 401
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Выпустить новый access token
      operationId: refreshAccessToken
      description: |
        Требуется действующий access token в Authorization: Bearer <token>.
        Возвращается новый access token сроком на семь суток. Отдельного
        refresh token нет; с просроченным access token нужно войти заново.
        Тело запроса не требуется. Старый access token не отзывается.
      responses:
        '200':
          description: Новый access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/search:
    get:
      tags:
        - Users
      summary: Найти пользователей по имени
      description: |
        Используется при создании нового чата. Возвращает только имя и id пользователя
      operationId: searchUsers
      parameters:
        - name: username
          in: query
          required: true
          description: Часть имени пользователя
          schema:
            type: string
            minLength: 1
            maxLength: 50
          example: alex
        - name: limit
          in: query
          required: false
          description: Максимальное количество результатов
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Найденные пользователи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResponse'
        '404':
          description: Пользователи с указанной подстрокой не найдены (NO_SUCH_USER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/chats:
    get:
      tags:
        - Chats
      summary: Получить чаты текущего пользователя
      operationId: getChats
      responses:
        '200':
          description: Список чатов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Chats
      summary: Создать чат
      description: |
        Создаёт личный чат между текущим пользователем и указанным собеседником.
        Текущий пользователь определяется по JWT и добавляется автоматически.
      operationId: createChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '200':
          description: Чат создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Указанный пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/chats/{chatId}/messages:
    get:
      tags:
        - Chats
      summary: Получить историю сообщений
      description: |
        Без параметра `beforeMessageId` возвращает последние сообщения чата.
        Для подгрузки более старых сообщений клиент передаёт
        `nextBeforeMessageId` из предыдущего ответа.

      operationId: getChatMessages
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - name: beforeMessageId
          in: query
          required: false
          description: ID сообщения, перед которым нужно загрузить историю
          schema:
            $ref: '#/components/schemas/Id'
          example: 781
        - name: limit
          in: query
          required: false
          description: Максимальное количество сообщений
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Страница сообщений от новых к старым
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Сообщение beforeMessageId не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT для доступа к защищённым HTTP-ручкам

  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      description: Идентификатор чата
      schema:
        $ref: '#/components/schemas/Id'

  responses:
    Authenticated:
      description: JWT сроком на семь суток и профиль пользователя
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'

    BadRequest:
      description: |
        Некорректный запрос, JSON или параметры. Формат стандартной ошибки
        Spring может отличаться от ErrorResponse.

    Unauthorized:
      description: |
        JWT отсутствует, недействителен или истёк. Ответ формируется
        Spring Security; наличие JSON-тела ErrorResponse не гарантируется.

    InternalServerError:
      description: Ошибка обращения к базе данных (DATABASE_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: DATABASE_ERROR
            message: Database operation failed
            status: 500

  schemas:
    RegistrationRequest:
      type: object
      required:
        - username
        - login
        - password
      properties:
        username:
          type: string
          description: Уникальное публичное имя; в БД VARCHAR(50)
          example: alex
        login:
          type: string
          description: Уникальный логин для входа; в БД VARCHAR(50)
          example: alex_login
        password:
          type: string
          format: password
          writeOnly: true
          description: Пароль; сервер сохраняет BCrypt-хеш
          example: example-password
        birthday:
          type: [string, 'null']
          format: date
          example: '2003-05-15'

    AuthorisationRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          example: alex_login
        password:
          type: string
          format: password
          writeOnly: true
          example: example-password

    User:
      type: object
      required:
        - id
        - username
        - bio
        - birthday
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          example: alex
        bio:
          type: [string, 'null']
          example: ''
        birthday:
          type: [string, 'null']
          format: date
          example: '2003-05-15'

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Подписанный access JWT; sub содержит ID пользователя
        user:
          $ref: '#/components/schemas/User'

    RefreshResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Новый access JWT

    Id:
      type: integer
      format: int64
      example: 42

    UserSummary:
      type: object
      required:
        - id
        - username
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          example: alex

    UserSearchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'

    CreateChatRequest:
      type: object
      required:
        - memberId
      properties:
        memberId:
          description: ID собеседника
          $ref: '#/components/schemas/Id'

    Chat:
      type: object
      required:
        - id
        - members
      properties:
        id:
          $ref: '#/components/schemas/Id'
        members:
          type: array
          minItems: 2
          maxItems: 2
          description: Текущий пользователь и его собеседник
          items:
            $ref: '#/components/schemas/UserSummary'

    ChatSummary:
      type: object
      required:
        - id
        - members
        - lastMessage
      properties:
        id:
          $ref: '#/components/schemas/Id'
        members:
          type: array
          minItems: 2
          maxItems: 2
          description: Текущий пользователь и его собеседник
          items:
            $ref: '#/components/schemas/UserSummary'
        lastMessage:
          oneOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'

    ChatListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatSummary'

    Message:
      type: object
      required:
        - id
        - chatId
        - userId
        - content
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        chatId:
          $ref: '#/components/schemas/Id'
        userId:
          $ref: '#/components/schemas/Id'
        content:
          type: string
          minLength: 1
          maxLength: 300
          example: Привет
        createdAt:
          type: string
          format: date-time
          example: '2026-08-19T12:30:45Z'

    MessagePage:
      type: object
      required:
        - items
        - nextBeforeMessageId
      properties:
        items:
          type: array
          description: Сообщения от новых к старым
          items:
            $ref: '#/components/schemas/Message'
        nextBeforeMessageId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
          description: ID для следующей страницы или null, если сообщений больше нет
          example: 730

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - status
      properties:
        error:
          type: string
          description: Код ошибки приложения
          example: DATABASE_ERROR
        message:
          type: string
        status:
          type: integer
          format: int32
          description: HTTP-статус, совпадающий со статусом ответа
          example: 500
